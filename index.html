<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS News OCR - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
        }

.container {
    max-width: 100%;  /* <-- НА ВЕСЬ ЕКРАН */
    margin: 0 auto;
    padding: 0 20px;  /* <-- НЕВЕЛИКИЙ ВІДСТУП ДЛЯ КОНТЕНТУ */
}

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .filters {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .filter-group input,
        .filter-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            align-self: flex-end;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stats {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .news-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .news-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1000px 1fr;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .news-image {
            position: relative;
            overflow: hidden;
        }

        .news-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .news-type-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
            text-transform: uppercase;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .badge-urgent {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .badge-top {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .news-content {
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .news-header {
            margin-bottom: 15px;
        }

        .news-channel {
            color: #667eea;
            font-weight: 600;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .news-time {
            color: #999;
            font-size: 0.85em;
        }

.news-text {
    font-size: 1.6em;  /* Збільшено з 1.3em */
    line-height: 1.8;  /* Збільшено для кращої читабельності */
    color: #333;
    margin-bottom: 20px;
    direction: rtl;
    text-align: right;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight: 500;  /* Додано напівжирність */
}

        .news-metadata {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: auto;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .metadata-item {
            display: flex;
            flex-direction: column;
        }

        .metadata-label {
            font-size: 0.75em;
            color: #999;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .metadata-value {
            font-size: 0.95em;
            color: #333;
            font-weight: 500;
        }

        .topic-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #f0f0f0;
            border-radius: 15px;
            font-size: 0.85em;
            color: #667eea;
            font-weight: 600;
        }

        .sentiment-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
            color: white;
        }

        .sentiment-negative {
            background: #f5576c;
        }

        .sentiment-neutral {
            background: #ffa726;
        }

        .sentiment-positive {
            background: #66bb6a;
        }

        .entities-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .entity-tag {
            padding: 4px 10px;
            background: #e3f2fd;
            border-radius: 12px;
            font-size: 0.8em;
            color: #1976d2;
        }

        .load-more {
            text-align: center;
            margin-top: 30px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #f5576c;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .empty-state {
            background: white;
            padding: 60px;
            border-radius: 15px;
            text-align: center;
            color: #999;
            font-size: 1.2em;
        }

        @media (max-width: 968px) {
            .news-card {
                grid-template-columns: 1fr;
            }

            .news-image {
                height: 300px;
            }

            .news-text {
                font-size: 1.1em;
            }
        }

        /* LIGHTBOX STYLES */
#lightboxModal {
    animation: fadeIn 0.3s;
}

#lightboxModal img {
    transition: transform 0.3s ease;
    cursor: zoom-in;
}

#lightboxModal img.zoomed {
    transform: scale(2);
    cursor: zoom-out;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Збільшений арабський текст */
.news-text-arabic {
    font-size: 1.6em !important;
    line-height: 1.8 !important;
    font-weight: 500;
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📺 HLS News OCR Dashboard</h1>
            <p class="subtitle">Моніторинг новинних стрічок у реальному часі</p>
        </header>

        <div class="filters">
            <div class="filter-group">
                <label>Канал</label>
                <select id="channelFilter" onchange="loadNews(true)">
                    <option value="">Всі канали</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Тип новин</label>
                <select id="typeFilter">
                    <option value="">Всі типи</option>
                    <option value="TOP_STORY">Top Story</option>
                    <option value="URGENT">Breaking News</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Пошук</label>
                <input type="text" id="searchFilter" placeholder="Введіть текст для пошуку...">
            </div>
            <div class="filter-group">
                <label>&nbsp;</label>
                <button class="btn" onclick="loadNews()">🔍 Фільтрувати</button>
            </div>
        </div>

        <div class="stats" id="statsContainer">
            <div class="stat-card">
                <div class="stat-value" id="totalNews">0</div>
                <div class="stat-label">Всього новин</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalUrgent">0</div>
                <div class="stat-label">Термінових</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalChannels">0</div>
                <div class="stat-label">Каналів</div>
            </div>
        </div>

        <div id="newsContainer" class="news-container">
            <div class="loading">Завантаження новин...</div>
        </div>

        <div class="load-more">
            <button class="btn" id="loadMoreBtn" onclick="loadMore()" style="display: none;">
                Завантажити ще
            </button>
        </div>
    </div>

     <script>
        // ==========================================
        // 🆕 ГЛОБАЛЬНІ ЗМІННІ
        // ==========================================
        const API_BASE = 'http://localhost:10000';
        let currentOffset = 0;
        const LIMIT = 20;

        // Ініціалізація при завантаженні сторінки
        document.addEventListener('DOMContentLoaded', () => {
            loadChannels();
            loadStats();
            loadNews(true);
            
            // Lightbox події
            const lightboxModal = document.getElementById('lightboxModal');
            if (lightboxModal) {
                lightboxModal.addEventListener('click', function(e) {
                    if (e.target === this) closeLightbox();
                });
            }
            
            // Закриття по ESC
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeLightbox();
            });
        });

        // ==========================================
        // 🆕 1. НАДІЙНЕ ЗАВАНТАЖЕННЯ СПИСКУ КАНАЛІВ
        // ==========================================
        async function loadChannels() {
            try {
                const response = await fetch(`${API_BASE}/api/channels`);
                const data = await response.json();
                const select = document.getElementById('channelFilter'); // ✅ Використовуємо правильний ID з HTML
                
                // Підтримуємо і масив ["ch1", "ch2"], і об'єкт {"ch1": {}, "ch2": {}}
                const channelsList = Array.isArray(data.channels) 
                    ? data.channels 
                    : Object.keys(data.channels || {});
                
                select.innerHTML = '<option value="">📺 Всі канали</option>';
                
                if (channelsList.length > 0) {
                    channelsList.forEach(ch => {
                        const option = document.createElement('option');
                        option.value = ch;
                        option.textContent = '📡 ' + ch.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                        select.appendChild(option);
                    });
                    
                    // Оновлюємо лічильник у статистиці
                    const totalChannelsEl = document.getElementById('totalChannels');
                    if (totalChannelsEl) totalChannelsEl.textContent = channelsList.length;
                }
            } catch (error) {
                console.error('❌ Помилка завантаження каналів:', error);
            }
        }

        // ==========================================
        // 2. ЗАВАНТАЖЕННЯ СТАТИСТИКИ
        // ==========================================
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();
                
                document.getElementById('totalNews').textContent = data.total_items || 0;
                document.getElementById('totalUrgent').textContent = data.by_type?.URGENT || 0;
                // Кількість каналів тепер оновлюється в loadChannels, але залишаємо фолбек
                if (!document.getElementById('totalChannels').textContent) {
                    document.getElementById('totalChannels').textContent = Object.keys(data.by_channel || {}).length;
                }
            } catch (error) {
                console.error('Помилка завантаження статистики:', error);
            }
        }

        // ==========================================
        // 🆕 3. ЗАВАНТАЖЕННЯ НОВИН З МІТТЄВОЮ РЕАКЦІЄЮ
        // ==========================================
        async function loadNews(reset = true) {
            if (reset) {
                currentOffset = 0;
                document.getElementById('newsContainer').innerHTML = '<div class="loading">Завантаження новин...</div>';
            }

            // ✅ Читаємо з правильного ID
            const channel = document.getElementById('channelFilter').value;
            const newsType = document.getElementById('typeFilter').value;
            const search = document.getElementById('searchFilter').value;

            const params = new URLSearchParams({
                limit: LIMIT,
                offset: currentOffset
            });

            // ❗ ВАЖЛИВО: додаємо параметр channel ТІЛЬКИ якщо він не порожній
            if (channel) params.append('channel', channel);
            if (newsType) params.append('news_type', newsType);
            if (search) params.append('search', search);

            const url = `${API_BASE}/api/news?${params.toString()}`;
            console.log('🔍 Запит до API:', url);

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (reset) {
                    document.getElementById('newsContainer').innerHTML = '';
                }

                if (data.items.length === 0 && reset) {
                    document.getElementById('newsContainer').innerHTML = 
                        '<div class="empty-state">📭 Новин не знайдено за обраними фільтрами</div>';
                    document.getElementById('loadMoreBtn').style.display = 'none';
                    return;
                }

                data.items.forEach(item => {
                    const card = createNewsCard(item);
                    document.getElementById('newsContainer').appendChild(card);
                });

                currentOffset += data.items.length;

                const loadMoreBtn = document.getElementById('loadMoreBtn');
                if (currentOffset < data.total) {
                    loadMoreBtn.style.display = 'inline-block';
                } else {
                    loadMoreBtn.style.display = 'none';
                }

            } catch (error) {
                console.error('❌ Помилка завантаження новин:', error);
                document.getElementById('newsContainer').innerHTML = 
                    '<div class="error">❌ Помилка завантаження даних. Перевірте, чи запущений API сервер.</div>';
            }
        }

        function loadMore() {
            loadNews(false);
        }

        // ==========================================
        // 4. СТВОРЕННЯ КАРТКИ НОВИНИ (Без змін, ваш код чудовий)
        // ==========================================
        function createNewsCard(item) {
            const card = document.createElement('div');
            card.className = 'news-card';

            const ch = item.channel || 'unknown'; // 🆕 Захист від відсутнього поля
            const screenshotFilename = item.screenshot ? item.screenshot.split('/').pop() : '';
            const imageUrl = screenshotFilename ? `${API_BASE}/api/image/${ch}/${screenshotFilename}` : '';

            const isUrgent = item.news_type === 'URGENT';
            const badgeClass = isUrgent ? 'badge-urgent' : 'badge-top';
            const badgeText = isUrgent ? '🔴 URGENT' : '🔵 TOP STORY';

            const sentiment = item.enrichment?.sentiment || 'neutral';
            const sentimentClass = `sentiment-${sentiment}`;
            const sentimentText = sentiment === 'negative' ? 'Негативний' : 
                                  sentiment === 'positive' ? 'Позитивний' : 'Нейтральний';

            const entities = item.enrichment?.entities || {};
            const allEntities = [
                ...(entities.persons || []),
                ...(entities.countries || []),
                ...(entities.cities || [])
            ];

            const timestamp = new Date(item.timestamp);
            const timeStr = timestamp.toLocaleString('uk-UA', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });

            const frameMatch = screenshotFilename.match(/_(\d+)\.jpg$/); 
            const frameNumber = frameMatch ? frameMatch[1] : null;
            const tsMatch = screenshotFilename.match(/(\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2})/);
            const timestampStr = tsMatch ? tsMatch[1] : null;

            card.innerHTML = `
                <div class="news-image">
                    <img src="${imageUrl}" alt="Screenshot" 
                         onclick="openLightbox('${imageUrl}')" 
                         style="cursor: zoom-in;"
                         onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22><rect fill=%22%23f0f0f0%22 width=%22400%22 height=%22300%22/><text fill=%22%23999%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2220%22>Зображення недоступне</text></svg>'">
                    <div class="news-type-badge ${badgeClass}">${badgeText}</div>
                </div>
                <div class="news-content">
                    <div class="news-header">
                        <div class="news-channel">📺 ${ch.toUpperCase()}</div>
                        <div class="news-time">🕐 ${timeStr} | ⏱️ ${item.time_range || 'N/A'}</div>
                    </div>
                    <div class="news-text">${item.original_text || 'Текст недоступний'}</div>
                    
                    <div class="news-metadata" style="display: grid; grid-template-columns: 1fr 12fr; gap: 20px; align-items: start; margin-top: 20px; padding-top: 20px; border-top: 2px solid #f0f0f0;">
                        <div style="display: flex; flex-direction: column; gap: 12px;">
                            <div class="metadata-item">
                                <div class="metadata-label">Тема</div>
                                <div class="metadata-value">
                                    <span class="topic-badge">${item.enrichment?.topic || 'Unknown'}</span>
                                </div>
                            </div>
                            ${allEntities.length > 0 ? `
                            <div class="metadata-item">
                                <div class="metadata-label">Сутності</div>
                                <div class="metadata-value">
                                    <div class="entities-list">
                                        ${allEntities.map(e => `<span class="entity-tag">${e}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                            ` : ''}
                            <div class="metadata-item">
                                <div class="metadata-label">Сентимент</div>
                                <div class="metadata-value">
                                    <span class="sentiment-badge ${sentimentClass}">${sentimentText}</span>
                                </div>
                            </div>
                        </div>
                        
                        ${frameNumber ? `
                        <div style="border-left: 2px dashed #e0e0e0; padding-left: 20px;">
                            <div style="font-size: 0.85em; font-weight: bold; color: #667eea; margin-bottom: 10px;">
                                 ЗОНА РОЗПІЗНАВАННЯ
                            </div>
                            <div class="ocr-preview-container" 
                                 data-folder="urgent_preview" 
                                 data-prefix="news_${frameNumber}_" 
                                 data-suffix="urgent_preview.jpg">
                                <img src="" alt="OCR Zone" class="ocr-preview-img"
                                     style="width: 100%; border-radius: 6px; border: 2px solid #e0e0e0; display: block; min-height: 100px; background: #f5f5f5;">
                                <div class="ocr-error-msg" style="display: none; color: #999; text-align: center; padding: 30px; background: #fafafa; border-radius: 6px; font-size: 0.85em;">
                                    ⚠️ Зображення не знайдено для кадру #${frameNumber}
                                </div>
                            </div>
                            
                            <div id="headline-timeline-${frameNumber}" style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #e0e0e0;">
                                <div style="font-size: 0.75em; font-weight: bold; color: #999; margin-bottom: 10px;">
                                     ⏱️ ІСТОРІЯ ЗАГОЛОВКІВ (${item.time_range || 'N/A'})
                                </div>
                                <div class="headline-frames" style="display: flex; flex-wrap: wrap; gap: 8px; max-width: 100%;">
                                    <div style="color: #999; font-size: 0.8em; text-align: center; padding: 15px; width: 100%;">
                                        Завантаження...
                                    </div>
                                </div>
                            </div>
                        </div>
                        ` : '<div style="color: #999; text-align: center; padding: 40px;">Номер кадру не визначено</div>'}
                    </div>
                </div>
            `;

            if (frameNumber && timestampStr) {
                setTimeout(() => {
                    const ocrContainer = card.querySelector('.ocr-preview-container');
                    if (ocrContainer) {
                        const folder = ocrContainer.dataset.folder;
                        const prefix = ocrContainer.dataset.prefix;
                        const suffix = ocrContainer.dataset.suffix;
                        const img = ocrContainer.querySelector('.ocr-preview-img');
                        const errMsg = ocrContainer.querySelector('.ocr-error-msg');
                        
                        fetch(`${API_BASE}/api/diagnostic/find?channel=${ch}&folder=${folder}&prefix=${prefix}&suffix=${suffix}&timestamp=${timestampStr}`)
                            .then(res => res.json())
                            .then(data => {
                                if (data.filename) {
                                    img.src = `${API_BASE}/api/diagnostic/${folder}/${ch}/${data.filename}`;
                                    img.style.display = 'block';
                                    errMsg.style.display = 'none';
                                } else {
                                    img.style.display = 'none';
                                    errMsg.style.display = 'block';
                                }
                            })
                            .catch(err => {
                                img.style.display = 'none';
                                errMsg.style.display = 'block';
                            });
                    }

                    if (item.time_range && typeof item.time_range === 'string' && item.time_range.includes(' - ')) {
                        const [startTime, endTime] = item.time_range.split(' - ');
                        const dateObj = new Date(item.timestamp);
                        const startDate = !isNaN(dateObj.getTime()) ? dateObj.toISOString().split('T')[0] : new Date().toISOString().split('T')[0];
                        const startTimestamp = `${startDate}_${startTime.trim().replace(/:/g, '-')}`;
                        const endTimestamp = `${startDate}_${endTime.trim().replace(/:/g, '-')}`;

                        fetch(`${API_BASE}/api/diagnostic/headline-timeline?channel=${ch}&start_time=${startTimestamp}&end_time=${endTimestamp}`)
                            .then(res => res.json())
                            .then(data => {
                                const timelineContainer = card.querySelector(`#headline-timeline-${frameNumber} .headline-frames`);
                                if (timelineContainer && data.frames && data.frames.length > 0) {
                                    timelineContainer.innerHTML = data.frames.map(frame => `
                                        <div style="flex: 0 0 80px; max-width: 80px; text-align: center;">
                                            <img src="${API_BASE}/api/diagnostic/headline_preview/${ch}/${frame.filename}" 
                                                 style="width: 80px; height: 45px; object-fit: cover; border-radius: 3px; border: 1px solid #ddd; background: #f0f0f0;"
                                                 onerror="this.style.display='none'">
                                            <div style="font-size: 0.6em; color: #888; margin-top: 3px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                                ${frame.timestamp.split('_')[1].replace(/-/g, ':')}
                                            </div>
                                        </div>
                                    `).join('');
                                } else if (timelineContainer) {
                                    timelineContainer.innerHTML = '<div style="color: #999; font-size: 0.8em; text-align: center; padding: 10px; width: 100%;">Немає даних</div>';
                                }
                            });
                    }
                }, 200);
            }
            return card;
        }

        // ==========================================
        // 5. LIGHTBOX ФУНКЦІЇ
        // ==========================================
        function openLightbox(imgSrc) {
            const modal = document.getElementById('lightboxModal');
            const modalImg = document.getElementById('lightboxImg');
            modal.style.display = 'block';
            modalImg.src = imgSrc;
            modalImg.classList.remove('zoomed');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const modal = document.getElementById('lightboxModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function toggleZoom() {
            const modalImg = document.getElementById('lightboxImg');
            modalImg.classList.toggle('zoomed');
        }
    </script>
     <div id="lightboxModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95);">
        <div style="position: absolute; top: 20px; right: 40px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 10000;" onclick="closeLightbox()">×</div>
        
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 90%; max-height: 85%;">
            <img id="lightboxImg" src="" style="max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 8px;" onclick="toggleZoom()">
        </div>
        
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: white; font-size: 14px; background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px;">
            🖱️ Клікніть для збільшення/зменшення • ESC для закриття
        </div>
    </div>
</body>
</html>
